[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floatfea"
version = "0.1.0"
description = "Structural finite element analysis of the FloatSim floating platform"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    # The .flr load interchange container is HDF5 with JSON metadata in the
    # root `meta` attribute -- docs/load-interchange-v1.md sec.3.
    "h5py>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "black==24.*",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["floatfea*"]
exclude = ["tests*", "docs*"]

# ---------------------------------------------------------------------------
# pytest -- the verification ladder is wired here, not in CI alone.
#
# docs/verification/README.md orders the ladder by dependency: a failure at
# rung n makes every rung above it uninterpretable. The `rung` marker exists so
# that ordering is machine-enforced rather than a convention in a document, and
# so adding a test to a rung is a one-line marker rather than a CI edit.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "rung1: solver is a solver -- rigid-body modes, patch test, unit scaling",
    "rung2: element is the element it claims to be -- cantilever, torsion, modes",
    "rung3: model is the platform -- mass correctness/consistency, sections",
    "rung4: loads are the loads -- equilibrium, mapping, frames, strips",
    "rung5: independent confirmation -- CalculiX, hand calculations",
    "rung6: it stays fixed -- golden-file regression",
]

# Hypothesis determinism is REQUIRED, not preferred -- and it is configured in
# tests/conftest.py, NOT here.
#
# Hypothesis has no pyproject.toml loader (verified against 6.152.1: there is no
# such reader in hypothesis.configuration). A `[tool.hypothesis]` table here
# would parse without error and do nothing, which is worse than absent for a
# determinism guarantee that G1.5 depends on -- it would read as configured
# while the suite kept drawing fresh seeds. The profile is registered and
# activated in tests/conftest.py, which is the only mechanism that works.

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["h5py", "yaml", "scipy", "scipy.sparse", "scipy.sparse.linalg"]
ignore_missing_imports = true
