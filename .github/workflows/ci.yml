name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Determinism is part of the gate, not a nicety. Reduction order in BLAS depends
# on thread count, so an unpinned thread count changes the last bits of a sum and
# makes bit-identity claims (G1.5) untestable.
env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"

jobs:
  static:
    name: lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # FULL HISTORY (CC3). `tests/test_report_carried.py` diffs against the
        # reviewed commit, and the default depth of 1 does not contain it -- so
        # `git diff` failed, the touched-set came back empty, and 23 site checks
        # passed as though the step had changed nothing. One machine, one
        # commit, one variable: full clone `122 passed`, `--depth 1`
        # `23 failed, 99 passed`.
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: ruff
        run: ruff check floatfea tests
      - name: black --check
        run: black --check floatfea tests
      - name: mypy
        run: mypy floatfea

  # THE GUARDS THEMSELVES, and they had never run here (R235). Every top-level
  # `tests/test_*.py` -- the tolerance-literal scanner, the carry guard, the
  # counter meta-test, the plan and figure checks, and the two corpora added at
  # CB0/CB1 -- was collected by no job at all: 1296 of 1589. Two commits said
  # "in the suite, so in CI" about files CI never saw.
  #
  # `tests/test_ci_runs_the_whole_suite.py` keeps this honest by parsing this
  # file and requiring the union of what the jobs name to be the whole suite, so
  # a test added where nothing runs it fails at that commit.
  guards:
    name: guards and meta-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # FULL HISTORY (CC3). `tests/test_report_carried.py` diffs against the
        # reviewed commit, and the default depth of 1 does not contain it -- so
        # `git diff` failed, the touched-set came back empty, and 23 site checks
        # passed as though the step had changed nothing. One machine, one
        # commit, one variable: full clone `122 passed`, `--depth 1`
        # `23 failed, 99 passed`.
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest tests --ignore=tests/unit --ignore=tests/verification --ignore=tests/regression -q

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # FULL HISTORY (CC3). `tests/test_report_carried.py` diffs against the
        # reviewed commit, and the default depth of 1 does not contain it -- so
        # `git diff` failed, the touched-set came back empty, and 23 site checks
        # passed as though the step had changed nothing. One machine, one
        # commit, one variable: full clone `122 passed`, `--depth 1`
        # `23 failed, 99 passed`.
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest tests/unit -q

  # ------------------------------------------------------------------
  # The verification ladder.
  #
  # docs/verification/README.md orders these by dependency: a failure at rung n
  # makes every rung above it uninterpretable. That ordering is enforced here by
  # `needs:` rather than left to whoever reads the output -- a red rung 1 stops
  # rung 2 from running at all, so nobody can investigate a rung 5 discrepancy
  # while a rung 1 test is red.
  #
  # Each rung is wired now, while empty. WHAT ADDING THE FIRST TEST TO AN EMPTY
  # RUNG COSTS, stated accurately (R236): dropping the file in is not enough --
  # the rung is declared `empty:` here and carries a `.empty-by-design` marker,
  # so the first test makes the declaration stale and the job FAILS. Delete the
  # marker and change `empty:` to `full:` in the same commit. That is a CI edit,
  # and the sentence that stood here said it was not, four lines above the block
  # that withdraws the previous version of the same claim.
  #
  # THIS COMMENT HAS BEEN WRONG TWICE, AND BOTH TIMES BECAUSE NOTHING RAN IT.
  #
  # It first said "an empty rung passes". `pytest` exits 5 for "no tests ran",
  # so rungs 2 and 5 failed the first time this workflow reached them -- which
  # was only after `lint and type-check` went green, because every ladder job is
  # `needs:`-gated behind it.
  #
  # The replacement inferred empty-versus-populated from a shell glob and named
  # "a renamed directory" as a defect it caught. THAT SENTENCE IS WITHDRAWN: the
  # reviewer built ten layouts and five were wrong. `ls A B` exits non-zero when
  # EITHER glob fails, so rung 6 -- whose own directory is empty by design --
  # never ran `tests/regression` and reported green; a renamed rung went from
  # exit 4 to exit 0; and a failing test one directory down passed silently.
  #
  # The logic is `scripts/run_rung.sh` now, so it can be executed off GitHub,
  # and `tests/test_ci_ladder_gating.py` runs it against all ten layouts in this
  # suite -- which means in CI. The expectation is DECLARED per directory rather
  # than inferred, because an emptied directory and one nobody has written yet
  # are opposite facts that no glob can tell apart. What each rung asserts:
  #
  #   full:<dir>   the directory exists and collects at least one test, and the
  #                run then stands on its own exit code. Exit 5 is a FAILURE.
  #   empty:<dir>  the directory exists, carries a `.empty-by-design` marker,
  #                and collects nothing. A test appearing there is a stale
  #                declaration and fails.
  # ------------------------------------------------------------------
  rung1:
    name: "ladder 1 -- the solver is a solver"
    runs-on: ubuntu-latest
    needs: [static, unit]
    steps:
      - uses: actions/checkout@v4
        # FULL HISTORY (CC3). `tests/test_report_carried.py` diffs against the
        # reviewed commit, and the default depth of 1 does not contain it -- so
        # `git diff` failed, the touched-set came back empty, and 23 site checks
        # passed as though the step had changed nothing. One machine, one
        # commit, one variable: full clone `122 passed`, `--depth 1`
        # `23 failed, 99 passed`.
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: sh scripts/run_rung.sh full:tests/verification/rung1

  rung2:
    name: "ladder 2 -- the element is the element"
    runs-on: ubuntu-latest
    needs: [rung1]
    steps:
      - uses: actions/checkout@v4
        # FULL HISTORY (CC3). `tests/test_report_carried.py` diffs against the
        # reviewed commit, and the default depth of 1 does not contain it -- so
        # `git diff` failed, the touched-set came back empty, and 23 site checks
        # passed as though the step had changed nothing. One machine, one
        # commit, one variable: full clone `122 passed`, `--depth 1`
        # `23 failed, 99 passed`.
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: sh scripts/run_rung.sh empty:tests/verification/rung2

  rung3:
    name: "ladder 3 -- the model is the platform"
    runs-on: ubuntu-latest
    needs: [rung2]
    steps:
      - uses: actions/checkout@v4
        # FULL HISTORY (CC3). `tests/test_report_carried.py` diffs against the
        # reviewed commit, and the default depth of 1 does not contain it -- so
        # `git diff` failed, the touched-set came back empty, and 23 site checks
        # passed as though the step had changed nothing. One machine, one
        # commit, one variable: full clone `122 passed`, `--depth 1`
        # `23 failed, 99 passed`.
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: sh scripts/run_rung.sh full:tests/verification/rung3

  rung4:
    name: "ladder 4 -- the loads are the loads"
    runs-on: ubuntu-latest
    needs: [rung3]
    steps:
      - uses: actions/checkout@v4
        # FULL HISTORY (CC3). `tests/test_report_carried.py` diffs against the
        # reviewed commit, and the default depth of 1 does not contain it -- so
        # `git diff` failed, the touched-set came back empty, and 23 site checks
        # passed as though the step had changed nothing. One machine, one
        # commit, one variable: full clone `122 passed`, `--depth 1`
        # `23 failed, 99 passed`.
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: sh scripts/run_rung.sh full:tests/verification/rung4

  rung5:
    name: "ladder 5 -- independent confirmation"
    runs-on: ubuntu-latest
    needs: [rung4]
    steps:
      - uses: actions/checkout@v4
        # FULL HISTORY (CC3). `tests/test_report_carried.py` diffs against the
        # reviewed commit, and the default depth of 1 does not contain it -- so
        # `git diff` failed, the touched-set came back empty, and 23 site checks
        # passed as though the step had changed nothing. One machine, one
        # commit, one variable: full clone `122 passed`, `--depth 1`
        # `23 failed, 99 passed`.
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: sh scripts/run_rung.sh empty:tests/verification/rung5

  rung6:
    name: "ladder 6 -- it stays fixed"
    runs-on: ubuntu-latest
    needs: [rung5]
    steps:
      - uses: actions/checkout@v4
        # FULL HISTORY (CC3). `tests/test_report_carried.py` diffs against the
        # reviewed commit, and the default depth of 1 does not contain it -- so
        # `git diff` failed, the touched-set came back empty, and 23 site checks
        # passed as though the step had changed nothing. One machine, one
        # commit, one variable: full clone `122 passed`, `--depth 1`
        # `23 failed, 99 passed`.
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: sh scripts/run_rung.sh empty:tests/verification/rung6 full:tests/regression
