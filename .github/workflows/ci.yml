name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Determinism is part of the gate, not a nicety. Reduction order in BLAS depends
# on thread count, so an unpinned thread count changes the last bits of a sum and
# makes bit-identity claims (G1.5) untestable.
env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"

jobs:
  static:
    name: lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: ruff
        run: ruff check floatfea tests
      - name: black --check
        run: black --check floatfea tests
      - name: mypy
        run: mypy floatfea

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest tests/unit -q

  # ------------------------------------------------------------------
  # The verification ladder.
  #
  # docs/verification/README.md orders these by dependency: a failure at rung n
  # makes every rung above it uninterpretable. That ordering is enforced here by
  # `needs:` rather than left to whoever reads the output -- a red rung 1 stops
  # rung 2 from running at all, so nobody can investigate a rung 5 discrepancy
  # while a rung 1 test is red.
  #
  # Each rung is wired now, while empty, so that adding a test to a rung is a
  # matter of dropping a file into tests/verification/rungN/ -- not a CI edit.
  # An empty rung passes; `--strict-markers` and the conftest ordering keep the
  # structure honest as tests arrive.
  # ------------------------------------------------------------------
  rung1:
    name: "ladder 1 -- the solver is a solver"
    runs-on: ubuntu-latest
    needs: [static, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest tests/verification/rung1 -q

  rung2:
    name: "ladder 2 -- the element is the element"
    runs-on: ubuntu-latest
    needs: [rung1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest tests/verification/rung2 -q

  rung3:
    name: "ladder 3 -- the model is the platform"
    runs-on: ubuntu-latest
    needs: [rung2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest tests/verification/rung3 -q

  rung4:
    name: "ladder 4 -- the loads are the loads"
    runs-on: ubuntu-latest
    needs: [rung3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest tests/verification/rung4 -q

  rung5:
    name: "ladder 5 -- independent confirmation"
    runs-on: ubuntu-latest
    needs: [rung4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest tests/verification/rung5 -q

  rung6:
    name: "ladder 6 -- it stays fixed"
    runs-on: ubuntu-latest
    needs: [rung5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest tests/verification/rung6 tests/regression -q
